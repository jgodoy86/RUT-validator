services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    # Chromium se cae con "Target crashed" si /dev/shm es muy pequeño (64 MB
    # por defecto en Docker); Playwright necesita más para renderizar DIAN.
    shm_size: "1gb"
    networks: [internal]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    # Sin "ports": el contenedor de la app no se publica en el host.
    # Solo Nginx es alcanzable desde fuera del contenedor.

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      # Se publica SOLO en la IP privada/VPN del servidor (BIND_IP en .env),
      # nunca en 0.0.0.0. Así, aunque el firewall del SO esté mal configurado,
      # Docker no expone el puerto 443 a internet.
      - "${BIND_IP:-127.0.0.1}:443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
      - ./deploy/.htpasswd:/etc/nginx/.htpasswd:ro
    networks: [internal]

networks:
  internal:
    driver: bridge
