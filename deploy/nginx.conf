# Reverse proxy para el Validador RUT. Solo escucha en el puerto interno
# (ver BIND_IP en .env / docker-compose.yml) — no hay listener en :80 porque
# esta app nunca debe quedar expuesta a internet.
server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Coincide con el límite de subida configurado en .streamlit/config.toml (10 MB).
    client_max_body_size 12m;

    # Segunda capa de acceso además de la VPN/firewall: usuario y clave
    # compartidos del equipo. Generar con: htpasswd -c deploy/.htpasswd usuario
    auth_basic           "Validador RUT - Acceso restringido";
    auth_basic_user_file /etc/nginx/.htpasswd;

    location / {
        proxy_pass http://app:8501;

        # Streamlit usa un WebSocket persistente para el rerun del script;
        # sin estos headers y timeout la UI se desconecta a los pocos segundos.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
