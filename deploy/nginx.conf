# Reverse proxy para el Validador RUT. Escucha en :8443 (443/80 ya los usa
# Apache en este servidor para los portales públicos existentes) — no hay
# listener en :80 porque esta app nunca debe quedar expuesta a internet.
server {
    listen 8443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Coincide con el límite de subida configurado en .streamlit/config.toml (10 MB).
    client_max_body_size 12m;

    # Segunda capa de acceso además de la VPN/firewall: usuario y clave
    # compartidos del equipo. Generar con: htpasswd -c deploy/.htpasswd usuario
    auth_basic           "Validador RUT - Acceso restringido";
    auth_basic_user_file /etc/nginx/.htpasswd;

    location / {
        proxy_pass http://app:8501;

        # Streamlit usa un WebSocket persistente para el rerun del script;
        # sin estos headers y timeout la UI se desconecta a los pocos segundos.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;

        # $host (a diferencia de $http_host) recorta el puerto; Streamlit
        # compara este Host contra el header Origin (que sí trae el puerto)
        # para aceptar el WebSocket, así que aquí se necesita $http_host.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
