services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    # Chromium se cae con "Target crashed" si /dev/shm es muy pequeño (64 MB
    # por defecto en Docker); Playwright necesita más para renderizar DIAN.
    shm_size: "1gb"
    volumes:
      # Persiste el .env del host dentro del contenedor. Sin esto, la API key
      # que se guarda desde la barra lateral se escribe en el .env interno del
      # contenedor y se pierde en cada reconstrucción (docker compose build).
      # Montado, la clave queda en el archivo del servidor y sobrevive updates.
      - ./.env:/app/.env
    networks: [internal]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    # Sin "ports": el contenedor de la app no se publica en el host.
    # Solo Nginx es alcanzable desde fuera del contenedor.

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      # Puerto 8443 (no 443): en este servidor Apache ya ocupa 80/443 para
      # los portales públicos existentes. BIND_IP permite restringir a una
      # IP interna si el host llega a tener más de una interfaz; con una sola
      # IP (como aquí), el aislamiento real depende del firewall perimetral
      # del proveedor de la nube — pídeles que solo abran 8443 para la
      # VPN/red interna, igual que ya tienen para los puertos 3000/5678.
      - "${BIND_IP:-0.0.0.0}:8443:8443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
      - ./deploy/.htpasswd:/etc/nginx/.htpasswd:ro
    networks: [internal]

networks:
  internal:
    driver: bridge
